<script>
'use strict';
/* No libraries, external requests or secrets. Data stays in localStorage. */
const WORKSPACE_PATH=location.pathname.replace(/index\.html$/,'').replace(/\/?$/,'/');
const KEY='invoice-desk-data-v1:'+WORKSPACE_PATH,SCHEMA=1;
const $=(q,root=document)=>root.querySelector(q), $$=(q,root=document)=>[...root.querySelectorAll(q)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n/100);
const dateNow=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const addDays=(day,n)=>{let d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const displayDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const paise=n=>Math.round(Number(n)*100),round=n=>Math.round(n),number=n=>Number(n||0);
const defaults=()=>({schema:SCHEMA,revision:'',settings:{name:'',address:'',gstin:'',state:'Gujarat',code:'24',email:'',phone:'',bank:'',holder:'',account:'',ifsc:'',upi:'',prefix:'INV',terms:'Payment due as per the agreed terms.',days:15,defaultGST:18},customers:[],vendors:[],invoices:[],lastBackup:''});
let storageBroken=false,loadError='',data=defaults(),page='dashboard',search='',filter='all',modalDirty=false,lastFocus=null;
try{const raw=localStorage.getItem(KEY);if(raw){data=validateBackup(JSON.parse(raw));}}catch(e){storageBroken=true;loadError='Saved data could not be read. Restore a valid backup before making changes. Your existing data has not been overwritten.';}
function persist(next){if(storageBroken)throw Error('Storage is unavailable. Restore a valid backup or use a browser with storage enabled.');const actual=localStorage.getItem(KEY);let rev='';try{rev=actual?JSON.parse(actual).revision||'':'';}catch{throw Error('Stored data cannot be read. Restore a backup first.');}if(rev!==data.revision)throw Error('Another tab changed the records. Reload this page before saving.');next=structuredClone(next);next.revision=uid();localStorage.setItem(KEY,JSON.stringify(next));data=next;renderHeader();}
function change(fn){const next=structuredClone(data);fn(next);persist(next);}
function notify(msg,error=false){const t=document.createElement('div');t.className='toast'+(error?' error':'');t.textContent=msg;const toastHost=document.querySelector('dialog[open] .dialogbody')||$('#toasts');document.querySelectorAll('.toast').forEach(x=>x.remove());toastHost.append(t);setTimeout(()=>t.remove(),5500);}
const icons={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',invoices:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6m-6 4h6"/>',customers:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>',vendors:'<path d="M3 10h18L19 3H5l-2 7Zm2 0v11h14V10M9 21v-7h6v7"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 3 3 3-2 3 1 2-3-1-3 2-3-3-2-1-3-3 1-3-2Z"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3v1"/>',money:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',plus:'<path d="M12 4v16M4 12h16"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.invoices}</svg>`;
function calc(inv){const lines=inv.items.map(l=>{const gross=round(Number(l.qty)*paise(l.rate)),discount=paise(l.discount),taxable=gross-discount,base=Number(l.gst)/100;const cgst=inv.taxType==='split'?round(taxable*base/2):0,sgst=cgst,igst=inv.taxType==='igst'?round(taxable*base):0;return {...l,gross,discountPaise:discount,taxable,cgst,sgst,igst};});const total=k=>lines.reduce((a,l)=>a+l[k],0);const taxable=total('taxable'),cgst=total('cgst'),sgst=total('sgst'),igst=total('igst'),rounding=paise(inv.rounding||0);const grand=taxable+cgst+sgst+igst+rounding;const cash=(inv.payments||[]).reduce((a,p)=>a+paise(p.cash),0),tds=(inv.payments||[]).reduce((a,p)=>a+paise(p.tds),0);return {lines,taxable,cgst,sgst,igst,rounding,grand,cash,tds,balance:grand-cash-tds};}
function status(inv){if(inv.stage==='draft')return 'Draft';if(inv.stage==='cancelled')return 'Cancelled';const c=calc(inv);if(c.balance<=0)return 'Paid';if(inv.due<dateNow())return 'Overdue';if(c.cash+c.tds>0)return 'Part paid';return 'Unpaid';}
const badge=inv=>`<span class="badge ${status(inv).toLowerCase().replace(' ','')}">${status(inv)}</span>`;
function button(text,action,id='',cls=''){return `<button type="button" class="${cls}" data-action="${action}"${id?` data-id="${esc(id)}"`:''}>${text}</button>`;}
function field(label,name,value='',type='text',opts={}){return `<div class="field${opts.full?' full':''}"><label for="${name}">${label}${opts.required?' *':''}</label>${opts.textarea?`<textarea id="${name}" name="${name}" ${opts.required?'required':''} maxlength="${opts.max||3000}">${esc(value)}</textarea>`:`<input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${opts.required?'required':''} ${opts.attrs||''} maxlength="${opts.max||200}">`}${opts.hint?`<small>${opts.hint}</small>`:''}</div>`;}
function select(label,name,value,options,required=false){return `<div class="field"><label for="${name}">${label}${required?' *':''}</label><select id="${name}" name="${name}" ${required?'required':''}>${options.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;}
function heading(eyebrow,title,sub,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="muted">${sub}</p></div><div class="toolbar">${actions}</div></div>`;}
function renderHeader(){$('#businessName').textContent=data.settings.name||'Your business workspace';$('#todayLabel').textContent=displayDate(dateNow());$('#nav').innerHTML=[['dashboard','Overview'],['invoices','Sales invoices'],['customers','Customers'],['vendors','Vendors'],['settings','Business settings'],['help','Help & backups']].map(([n,t])=>`<button type="button" data-action="nav" data-id="${n}" class="${page===n?'active':''}" ${page===n?'aria-current="page"':''}>${icon(n)}${t}</button>`).join('');}
function render(){renderHeader();$('#app').innerHTML=(loadError?`<div class="notice error">${esc(loadError)}</div>`:'')+({dashboard:dashboard,invoices:invoiceList,customers:()=>contacts('customers'),vendors:()=>contacts('vendors'),settings:settingsPage,help:helpPage}[page]||dashboard)();}
function openModal(title,html,wide=false){lastFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').style.width=wide?'min(1100px,96vw)':'min(800px,96vw)';modalDirty=false;$('#modal').showModal();setTimeout(()=>$('#modalBody input, #modalBody select, #modalBody button')?.focus(),0);}

function viewInvoice(id){const i=data.invoices.find(x=>x.id===id);if(!i)return;const c=calc(i);openModal(i.number,`<div class="toolbar" style="margin-bottom:18px">${badge(i)}${button('Download PDF','pdf',id,'primary')}${button('Print / Save PDF','print',id)}${button('Edit','edit-invoice',id)}${button('Duplicate','duplicate',id)}${i.stage==='draft'?button('Issue invoice','issue',id):''}${i.stage==='issued'&&c.balance>0?button('+ Record payment','payment',id):''}${i.stage==='issued'&&!(i.payments||[]).length?button('Cancel invoice','cancel-invoice',id,'danger'):''}${i.stage==='draft'?button('Delete draft','delete-invoice',id,'danger'):''}</div><div class="notice"><span>Total ${money(c.grand)} · Received ${money(c.cash)} · TDS ${money(c.tds)} · Balance ${money(c.balance)}</span></div>${(i.payments||[]).length?`<section class="panel" style="margin-bottom:20px"><div class="panelhead"><h3 style="margin:0">Payment history</h3></div><div class="table-scroll"><table><thead><tr><th>Date</th><th>Reference</th><th>Cash / bank</th><th>TDS credit</th><th></th></tr></thead><tbody>${i.payments.map(p=>`<tr><td>${displayDate(p.date)}</td><td>${esc(p.ref)}</td><td>${money(paise(p.cash))}</td><td>${money(paise(p.tds))}</td><td>${button('Remove','remove-payment',id+'|'+p.id,'small danger')}</td></tr>`).join('')}</tbody></table></div></section>`:''}<div class="preview-scroll">${invoiceHTML(i)}</div>`,true);}

function settingsPage(){let b=data.settings;return heading('BUSINESS PROFILE','Make every invoice yours.','Your business details are copied into each new invoice.')+`<div class="settings-wrap"><form id="settingsForm"><div class="panel"><div class="panelbody"><section class="form-section"><h3>Business identity</h3><div class="grid">${field('Legal business name','name',b.name,'text',{required:true})}${field('GSTIN','gstin',b.gstin,'text',{required:true,max:15})}${field('Registered address','address',b.address,'text',{required:true,textarea:true,full:true,max:1000})}${field('State / UT name','state',b.state,'text',{required:true})}${field('Two-digit state / UT code','code',b.code,'text',{required:true,max:2,attrs:'pattern="[0-9]{2}"'})}${field('Email','email',b.email,'email')}${field('Phone','phone',b.phone,'tel')}</div></section><section class="form-section"><h3>Bank details</h3><div class="grid">${field('Bank name / branch','bank',b.bank)}${field('Account holder','holder',b.holder)}${field('Account number','account',b.account,'text',{attrs:'inputmode="numeric"'})}${field('IFSC','ifsc',b.ifsc)}${field('UPI ID (optional)','upi',b.upi)}</div></section><section class="form-section"><h3>Invoice defaults</h3><div class="grid three">${field('Invoice prefix','prefix',b.prefix,'text',{required:true,max:4,attrs:'pattern="[A-Za-z0-9]{1,4}"',hint:'Example: INV. Numbers include financial year.'})}${field('Payment due in days','days',b.days,'number',{required:true,attrs:'min="0" max="365" step="1"'})}${field('Default GST %','defaultGST',b.defaultGST,'number',{required:true,attrs:'min="0" max="100" step="0.01"',hint:'Editable per line. Confirm the applicable rate.'})}${field('Default payment terms','terms',b.terms,'text',{textarea:true,full:true})}</div></section><div class="notice"><span>Editing this profile affects new invoices. Existing invoices keep their original business details.</span></div><div class="form-foot"><button type="submit" class="primary">Save business settings</button></div></div></div></form></div>`;}
function helpPage(){return heading('GET STARTED','Simple invoicing. Your own records.','A complete, build-free workspace for GitHub Pages.')+`<div class="two-col"><section class="panel help-block"><div class="panelbody"><h2>From setup to your first PDF</h2><ol><li>Open Business settings and add your legal name, GSTIN, address and bank details.</li><li>Add your school or business customer in Customers.</li><li>Create an invoice. Confirm dates, contract reference, service period and place of supply.</li><li>Add service descriptions, SAC codes, quantity, rate, discounts and GST rates.</li><li>Save a draft or issue the invoice. Download PDF or use Print / Save PDF.</li><li>Record receipts and verified TDS separately. Status updates automatically.</li><li>Download backups regularly and before clearing browser data or moving devices.</li></ol><h3>How storage works</h3><p>Records are saved in this browser on this device, under this website address. Opening the same link on another device starts a separate workspace. A browser reset, private-browsing session or website address change can make records unavailable. Use backup and restore to move data.</p><h3>Sharing the link</h3><p>Anyone opening the public GitHub Pages link receives the app, not your local records. There is no login, cloud database or automatic sync. Protect access to the device itself. Use a separate repository/site address per client to keep workspaces separate on the same browser.</p><h3>What is included</h3><p>Customers, vendor contacts, invoice editing, draft/issued/cancelled stages, automatic payment status, receipts, TDS credits, dashboard, CSV exports and PDF downloads. GST is calculated per line and rounded to paise. Drafts and cancelled invoices do not count as sales or receivables.</p><h3>Scope of GST invoices</h3><p>This app is for INR forward-charge service invoices using CGST + SGST or IGST. UTGST, cess, exports, reverse charge, credit/debit notes, inventory and return filing are not automated. Confirm SAC, tax rate, place of supply and any e-invoicing requirement. No IRN or signed QR code is generated.</p><h3>PDF and printing</h3><p>Download PDF creates a multi-page PDF in your browser with no external service. Print / Save PDF uses your browser’s print dialog; turn off browser headers and footers and choose A4. Descriptions and notes support multiple lines.</p><h3>Correcting a saved invoice</h3><p>Edit opens the saved invoice. Customer details are preserved unless you choose a customer again. Existing seller details are preserved. Issued invoices with payments cannot become drafts or be cancelled until erroneous payment records are removed. Use the appropriate legal correction process for an already issued tax invoice.</p></div></section><section class="panel" style="align-self:start"><div class="panelbody"><h2>Backups & exports</h2><p class="muted">A JSON backup contains your business details, customers, vendors, invoices and payments. Keep it private.</p><div class="stack">${button('Download full backup','backup','','primary')}${button('Restore JSON backup','restore')}${button('Export sales register CSV','csv')}${storageBroken?button('Download unreadable stored data','raw-backup'):''}</div><p class="muted" style="font-size:12px;margin-top:16px">Restore replaces the records on this browser. Download a backup first. Last backup: ${data.lastBackup?displayDate(data.lastBackup):'Not yet created'}.</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Explore with sample records</h3><p class="muted">Available only when the workspace has no records. Fictional entries are marked as demo.</p>${button('Load fictional demo','demo')}<div style="margin-top:24px">${button('Clear workspace','reset','','danger')}</div></div></section></div>`;}
function download(blob,name){const url=URL.createObjectURL(blob);document.querySelectorAll('.download-notice').forEach(x=>x.remove());const notice=document.createElement('div');notice.className='notice download-notice';const label=document.createElement('span');label.textContent='Your file is ready. If the download did not start, use this link:';const a=document.createElement('a');a.href=url;a.download=name;a.textContent='Save '+name;a.className='download-link';notice.append(label,a);(document.querySelector('dialog[open] #modalBody')||document.querySelector('#app')).prepend(notice);a.click();setTimeout(()=>URL.revokeObjectURL(url),300000);}
function backup(){const next=structuredClone(data);next.lastBackup=dateNow();const blob=new Blob([JSON.stringify(next,null,2)],{type:'application/json'});try{persist(next);render();}catch(e){notify('Backup created. '+e.message,true);}download(blob,'InvoiceDesk-Backup-'+dateNow()+'.json');notify('Backup ready. Keep the file in a safe place.');}
function csv(){const rows=[['Invoice','Date','Due','Customer','Customer GSTIN','Place of supply','Stage','Status','Taxable INR','CGST INR','SGST INR','IGST INR','Rounding INR','Total INR','Received INR','TDS credit INR','Balance INR','Contract','Service period'],...data.invoices.map(i=>{const c=calc(i);return [i.number,i.date,i.due,i.customer.name,i.customer.gstin||'URP',i.posState+' / '+i.posCode,i.stage,status(i),...[c.taxable,c.cgst,c.sgst,c.igst,c.rounding,c.grand,c.cash,c.tds,c.balance].map(x=>(x/100).toFixed(2)),i.contract,i.period];})];const safe=x=>{let v=String(x??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};download(new Blob(['\ufeff'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'Sales-Register-'+dateNow()+'.csv');notify('Sales register download started.');}
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&new Date(d+'T12:00:00').toISOString().slice(0,10)===d;}
function validateBackup(obj){if(!obj||obj.schema!==SCHEMA||!obj.settings||!Array.isArray(obj.customers)||!Array.isArray(obj.vendors)||!Array.isArray(obj.invoices))throw Error('This is not an Invoice Desk backup.');if(obj.invoices.length>10000||obj.customers.length>10000||obj.vendors.length>10000)throw Error('Backup is too large.');const text=(x,n=3000)=>typeof x==='string'&&x.length<=n;const fields=['name','address','gstin','state','code','email','phone','bank','holder','account','ifsc','upi','prefix','terms'];function setting(b){if(!b||!fields.every(k=>text(b[k])))throw Error('Invalid business profile in backup.');if(!Number.isFinite(b.days)||b.days<0||b.days>365||!Number.isFinite(b.defaultGST)||b.defaultGST<0||b.defaultGST>100)throw Error('Invalid defaults in backup.');return Object.fromEntries([...fields.map(k=>[k,b[k]]),['days',b.days],['defaultGST',b.defaultGST]]);}const ids=new Set();const id=x=>{if(!text(x,100)||!/^[a-zA-Z0-9-]+$/.test(x)||ids.has(x))throw Error('Missing or duplicate record ID.');ids.add(x);return x;};const contact=c=>{if(!c||!text(c.name,150)||!c.name||!text(c.address,1000))throw Error('Invalid contact.');return {id:id(c.id),...Object.fromEntries(['name','address','gstin','state','code','contact','email','phone','bank','notes'].map(k=>[k,text(c[k])?c[k]:'']))};};const out=defaults();out.settings=setting(obj.settings);out.customers=obj.customers.map(contact);out.vendors=obj.vendors.map(contact);const seen=new Set();out.invoices=obj.invoices.map(i=>{if(!i||!text(i.number,16)||!validDate(i.date)||!validDate(i.due)||!['draft','issued','cancelled'].includes(i.stage)||!['split','igst'].includes(i.taxType)||!Array.isArray(i.items)||!i.items.length||i.items.length>50||!Array.isArray(i.payments)||i.payments.length>500||!i.customer||!text(i.customer.name,150)||!text(i.customer.address,1000)||!Number.isFinite(i.rounding)||Math.abs(i.rounding)>1)throw Error('Invalid invoice in backup.');const k=fiscal(i.date)+'|'+i.number;if(seen.has(k))throw Error('Duplicate invoice number in backup.');seen.add(k);const safe={id:id(i.id),seller:setting(i.seller),customer:Object.fromEntries(['name','address','gstin','state','code'].map(k=>[k,text(i.customer[k])?i.customer[k]:''])),...Object.fromEntries(['number','date','due','customerId','posState','posCode','taxType','contract','period','stage','terms','notes','created','updated'].map(k=>[k,text(i[k])?i[k]:''])),rounding:i.rounding,items:i.items.map(l=>{if(!l||!text(l.description,1500)||!text(l.sac,8)||!text(l.unit,30)||!['qty','rate','discount','gst'].every(k=>Number.isFinite(l[k]))||l.qty<=0||l.qty>1e6||l.rate<0||l.rate>1e9||l.discount<0||l.discount>l.qty*l.rate||l.gst<0||l.gst>100)throw Error('Invalid service line in backup.');return Object.fromEntries(['description','sac','qty','unit','rate','discount','gst'].map(k=>[k,l[k]]));}),payments:i.payments.map(p=>{if(!p||!validDate(p.date)||!text(p.ref,200)||![p.cash,p.tds].every(n=>Number.isFinite(n)&&n>=0&&n<=1e9))throw Error('Invalid payment in backup.');return {id:id(p.id),date:p.date,ref:p.ref,cash:p.cash,tds:p.tds};})};if(!Number.isSafeInteger(calc(safe).grand)||calc(safe).balance<0)throw Error('Invalid invoice totals in backup.');return safe;});out.revision=text(obj.revision,100)?obj.revision:'';out.lastBackup=text(obj.lastBackup,10)?obj.lastBackup:'';return out;}

const enc=new TextEncoder(),chunks=[];let offset=0,objects=[],positions=[0];const push=str=>{const a=typeof str==='string'?enc.encode(str):str;chunks.push(a);offset+=a.length;};push('%PDF-1.4\n');const count=2+pages.length*3;function obj(n,body){positions[n]=offset;push(n+' 0 obj\n');if(Array.isArray(body))body.forEach(push);else push(body);push('\nendobj\n');}obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');pages.forEach((url,i)=>{let base=3+i*3,jpeg=Uint8Array.from(atob(url.split(',')[1]),ch=>ch.charCodeAt(0)),content='q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ';obj(base,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${base+1} 0 R >> >> /Contents ${base+2} 0 R >>`);obj(base+1,[`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`,jpeg,'\nendstream']);obj(base+2,`<< /Length ${enc.encode(content).length} >>\nstream\n${content}\nendstream`);});const xref=offset;push('xref\n0 '+(count+1)+'\n0000000000 65535 f \n');for(let n=1;n<=count;n++)push(String(positions[n]).padStart(10,'0')+' 00000 n \n');push(`trailer\n<< /Size ${count+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(chunks,{type:'application/pdf'});}
function demo(){if(data.customers.length||data.vendors.length||data.invoices.length)throw Error('Demo loads only into an empty workspace. Export your backup before clearing any records.');if(!confirm('Load fictional DEMO business, customers and invoices? Replace all details before real use.'))return;change(d=>{d.settings={...d.settings,name:'DEMO — Brightline Marketing',address:'Fictional Business Address\nAhmedabad, Gujarat 380001',gstin:'24ABCDE1234F1Z5',bank:'Demo Bank',holder:'Demo Business',account:'0000000000',ifsc:'DEMO0000001'};const c={id:uid(),name:'DEMO — Greenfield School',address:'Fictional School Address\nAhmedabad, Gujarat 380001',gstin:'',state:'Gujarat',code:'24',contact:'Demo Accounts Team',email:'school@example.com',phone:'',bank:'',notes:'Fictional demonstration record'};d.customers.push(c);const item={description:'School admission campaign management',sac:'998361',qty:1,unit:'Month',rate:15000,discount:0,gst:18};for(let k=1;k<=3;k++){let date=addDays(dateNow(),-k*8);d.invoices.push({id:uid(),number:'DEMO/'+fiscal(date)+'/'+k.toString().padStart(3,'0'),date,due:addDays(date,15),customerId:c.id,customer:structuredClone(c),seller:structuredClone(d.settings),posState:'Gujarat',posCode:'24',taxType:'split',contract:'DEMO CONTRACT',period:'Demo service period',stage:k===3?'draft':'issued',items:[structuredClone(item)],rounding:0,terms:'Demonstration only. Not a real invoice.',notes:'DEMO — replace before real use.',payments:k===1?[{id:uid(),date:dateNow(),ref:'Demo partial receipt',cash:5000,tds:0}]:[],created:new Date().toISOString(),updated:new Date().toISOString()});}d.vendors.push({id:uid(),name:'DEMO — Print Studio',address:'Fictional vendor address',gstin:'',state:'Gujarat',code:'24',contact:'Demo Contact',email:'vendor@example.com',phone:'',bank:'',notes:'Fictional vendor'});});notify('Fictional demo loaded.');page='dashboard';render();}
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,id=btn.dataset.id;try{switch(a){case 'nav':page=id;search='';filter='all';render();break;case 'close':closeModal();break;case 'new-contact':contactForm(id||'customers');break;case 'edit-contact':{const[k,ident]=id.split('|');contactForm(k,ident);break;}case 'delete-contact':{const[k,ident]=id.split('|');if(k==='customers'&&data.invoices.some(i=>i.customerId===ident))throw Error('This customer is linked to invoices. Keep the customer record to preserve its history.');if(confirm('Delete this '+(k==='customers'?'customer':'vendor')+'?')){change(d=>d[k]=d[k].filter(x=>x.id!==ident));render();notify('Contact deleted.');}break;}case 'customer-invoice':invoiceForm(null,id);break;case 'new-invoice':invoiceForm();break;case 'edit-invoice':case 'duplicate':closeModal();if(!$('#modal').open)invoiceForm(id,'',a==='duplicate');break;case 'refresh-seller':editing.seller=structuredClone(data.settings);$('#sellerSnapshot').textContent=editing.seller.name||'Not set';modalDirty=true;notify('Current business profile copied into this invoice.');break;case 'add-line':{const root=$('#lineItems');if($$('[data-line]',root).length>=50)throw Error('Maximum 50 service lines per invoice.');root.insertAdjacentHTML('beforeend',lineEditor({description:'',sac:'',qty:1,unit:'Service',rate:0,discount:0,gst:data.settings.defaultGST},$$('[data-line]',root).length));modalDirty=true;updateLive();break;}case 'remove-line':if($$('[data-line]').length===1)throw Error('Keep at least one service line.');btn.closest('[data-line]').remove();$$('.line-number').forEach((x,i)=>x.textContent=i+1);modalDirty=true;updateLive();break;case 'view-invoice':viewInvoice(id);break;case 'payment':closeModal(true);paymentForm(id);break;case 'remove-payment':{const[invid,pid]=id.split('|');if(confirm('Remove this receipt / TDS credit? The outstanding balance will increase.')){change(d=>{let i=d.invoices.find(i=>i.id===invid);i.payments=i.payments.filter(p=>p.id!==pid);});viewInvoice(invid);render();}break;}case 'delete-invoice':{const i=data.invoices.find(i=>i.id===id);if(i.stage!=='draft')throw Error('Only drafts can be deleted.');if(confirm('Delete this draft permanently?')){change(d=>d.invoices=d.invoices.filter(i=>i.id!==id));closeModal(true);render();notify('Draft deleted.');}break;}case 'cancel-invoice':{const i=data.invoices.find(i=>i.id===id);if(i.payments.length)throw Error('Remove erroneous receipts before cancellation.');if(confirm('Mark this invoice cancelled? Its number stays reserved and it is excluded from dashboard sales.')){change(d=>d.invoices.find(i=>i.id===id).stage='cancelled');viewInvoice(id);render();}break;}case 'issue':{const i=data.invoices.find(i=>i.id===id);validateInvoice({...i,stage:'issued'},id);change(d=>d.invoices.find(i=>i.id===id).stage='issued');viewInvoice(id);render();notify('Invoice issued.');break;}case 'pdf':{const i=data.invoices.find(i=>i.id===id);btn.disabled=true;const pdf=await invoicePDF(i);download(pdf,i.number.replace(/[^a-zA-Z0-9-]/g,'_')+'.pdf');btn.disabled=false;notify('PDF download started.');break;}case 'print':{const i=data.invoices.find(i=>i.id===id);$('#printArea').innerHTML=invoiceHTML(i);window.print();break;}case 'backup':backup();break;case 'restore':$('#restoreFile').click();break;case 'csv':csv();break;case 'raw-backup':download(new Blob([localStorage.getItem(KEY)||''],{type:'application/json'}),'InvoiceDesk-unreadable-data.json');break;case 'demo':demo();break;case 'reset':if(confirm('Clear all business details, contacts, invoices and payments on this browser? Download a backup first.')){if(confirm('This cannot be undone without a backup. Clear this workspace?')){persist(defaults());page='dashboard';render();notify('Workspace cleared.');}}break;}}catch(err){btn.disabled=false;notify(err.message||'The action could not be completed.',true);}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;try{if(form.id==='contactForm'){const k=form.dataset.kind,old=form.dataset.id;const c={id:old||uid(),...Object.fromEntries(new FormData(form).entries())};c.gstin=c.gstin.toUpperCase().trim();if(!validGST(c.gstin))throw Error('Enter a valid GSTIN or leave it blank for an unregistered contact.');c.bank=c.bank||'';if(data[k].some(x=>x.id!==c.id&&x.name.toLowerCase()===c.name.toLowerCase()))throw Error('A contact with this name already exists.');change(d=>{let idx=d[k].findIndex(x=>x.id===old);if(idx<0)d[k].push(c);else d[k][idx]=c;});closeModal(true);render();notify('Contact saved.');}else if(form.id==='settingsForm'){const s={...Object.fromEntries(new FormData(form).entries())};s.gstin=s.gstin.toUpperCase().trim();s.code=s.code.trim();s.days=number(s.days);s.defaultGST=number(s.defaultGST);if(!validGST(s.gstin)||!s.gstin)throw Error('Enter a valid GSTIN.');if(s.gstin.slice(0,2)!==s.code)throw Error('GSTIN and state code must match.');change(d=>d.settings=s);notify('Business settings saved.');render();}else if(form.id==='invoiceForm'){const i=readInvoice(),old=form.dataset.existing;validateInvoice(i,old);change(d=>{const idx=d.invoices.findIndex(x=>x.id===old);if(idx<0)d.invoices.push(i);else d.invoices[idx]=i;});closeModal(true);page='invoices';render();viewInvoice(i.id);notify('Invoice saved.');}else if(form.id==='paymentForm'){const id=form.dataset.id,i=data.invoices.find(i=>i.id===id);let p={id:uid(),date:form.elements.payDate.value,ref:form.elements.payRef.value.trim(),cash:number(form.elements.payCash.value),tds:number(form.elements.payTDS.value)};if(!validDate(p.date)||p.date<i.date)throw Error('Receipt date must be on or after the invoice date.');if(![p.cash,p.tds].every(x=>Number.isFinite(x)&&x>=0)||paise(p.cash)+paise(p.tds)<=0)throw Error('Enter a positive receipt or verified TDS credit.');if(paise(p.cash)+paise(p.tds)>calc(i).balance)throw Error('Receipt plus TDS cannot exceed the outstanding balance.');change(d=>d.invoices.find(x=>x.id===id).payments.push(p));closeModal(true);render();viewInvoice(id);notify('Payment saved.');}}catch(err){if(form.id==='invoiceForm'){$('#invoiceError').textContent=err.message;$('#invoiceError').scrollIntoView({block:'center',behavior:'smooth'});}else notify(err.message,true);}});

$('#restoreFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>10*1024*1024)throw Error('Backup must be smaller than 10 MB.');const restored=validateBackup(JSON.parse(await file.text()));if(!confirm('Replace this browser’s existing records with '+restored.invoices.length+' invoices, '+restored.customers.length+' customers and '+restored.vendors.length+' vendors? Download a backup of current records first.'))return;restored.revision=uid();localStorage.setItem(KEY,JSON.stringify(restored));data=restored;storageBroken=false;loadError='';page='dashboard';closeModal(true);render();notify('Backup restored.');}catch(err){notify('Restore failed: '+err.message,true);}});
